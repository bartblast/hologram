pre-commit:
  parallel: true
  files: git -c core.quotePath=false diff --name-only --cached
  commands:
    check_cluster_elixir_code_formatted:
      glob: "test/cluster/*.{ex,exs}"
      run: cd test/cluster && (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/lib/hologram_cluster_tests/.mix/cached_dot_formatter && mix format --check-formatted
    check_cowboy_elixir_code_formatted:
      glob: "test/cowboy/*.{ex,exs}"
      run: cd test/cowboy && (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/lib/hologram_cowboy_tests/.mix/cached_dot_formatter && mix format --check-formatted
    check_ecosystem_elixir_code_formatted:
      glob: "test/ecosystem/*.{ex,exs}"
      run: cd test/ecosystem && (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/lib/hologram_ecosystem_tests/.mix/cached_dot_formatter && mix format --check-formatted
    check_features_elixir_code_formatted:
      glob: "test/features/*.{ex,exs}"
      run: cd test/features && (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/lib/hologram_feature_tests/.mix/cached_dot_formatter && mix format --check-formatted
    check_features_javascript_code_formatted:
      glob: "test/features/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,json5,jsonc,css,scss,less,html,vue,md,mdx,yml,yaml,graphql,gql,graphqls,hbs,handlebars,htm,livemd,markdown}"
      run: cd test/features && mix format.js.check
    check_lib_elixir_code_formatted:
      glob: "*.{ex,exs}"
      run: (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/lib/hologram/.mix/cached_dot_formatter && mix format --check-formatted
    check_lib_javascript_and_json_code_formatted:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,json5,jsonc,css,scss,less,html,vue,md,mdx,yml,yaml,graphql,gql,graphqls,hbs,handlebars,htm,livemd,markdown}"
      run: mix format.js.check
    check_minimal_elixir_code_formatted:
      glob: "test/minimal/*.{ex,exs}"
      run: cd test/minimal && (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/lib/hologram_minimal_tests/.mix/cached_dot_formatter && mix format --check-formatted
    check_umbrella_elixir_code_formatted:
      glob: "test/umbrella/*.{ex,exs}"
      run: cd test/umbrella && (mix deps.loadpaths --no-compile > /dev/null 2>&1 || MIX_QUIET=1 mix deps.get --check-locked) && rm -f _build/*/.mix/cached_dot_formatter && mix format --check-formatted
