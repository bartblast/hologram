name: CI

# Define workflow that runs when changes are pushed to the
# `dev` or `master` branch or pushed to a PR branch that targets the `dev`
# or `master` branch.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Sets the ENV `MIX_ENV` to `test` for running tests
env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  lib_tests:
    runs-on: ${{ matrix.os }}
    name: Lib Tests on ${{ matrix.os }}, Elixir ${{ matrix.elixir }}, Erlang/OTP ${{ matrix.otp }}, Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      # Each supported Elixir version is tested against every Erlang/OTP major it supports
      # within the supported OTP range, since that is where OTP and type-system
      # differences are most likely to surface.
      # OTP compatibility per Elixir version:
      # https://hexdocs.pm/elixir/compatibility-and-deprecations.html#between-elixir-and-erlang-otp
      #
      # Notes on the bounds:
      # - Client-side regex support requires PCRE2 semantics (OTP 28+) and :re.import/1 (OTP 28.1+),
      #   so OTP 28.1 is the floor.
      # - Elixir 1.19 is the oldest version cleanly pairing with OTP 28, so 1.19 is the floor.
      # - Underlying older constraints, superseded by the floors above: multi-letter uppercase
      #   sigils (~HOLO) were introduced in Elixir 1.15.0, Elixir 1.15+ requires Erlang/OTP 24+,
      #   and cowlib 2.14+ requires OTP 23+.
      # - Node.js only builds the JS step (actual JS runs in browsers), so we pin the latest LTS
      #   only, matching .tool-versions for dev/prod/CI parity. Floor rationale: the Web Crypto API
      #   requires Node 19+, and a few JS libs used by Hologram require Node 20+.
      # - Windows only smoke-tests the newest Elixir on the newest OTP: Windows failures are
      #   OS-specific (paths, shell), not Elixir- or OTP-version-specific, so Ubuntu carries full
      #   coverage.
      #   TODO: change windows-2022 back to windows-latest when erlef/setup-beam supports win25.
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5"
            node: "24.13.0"
          - os: ubuntu-latest
            elixir: "1.20.0"
            otp: "28.5"
            node: "24.13.0"
          - os: ubuntu-latest
            elixir: "1.20.0"
            otp: "29.0"
            node: "24.13.0"
          - os: windows-2022
            elixir: "1.20.0"
            otp: "29.0"
            node: "24.13.0"
    steps:
      # Step: Setup Elixir + Erlang/OTP image as the base.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Step: Checkout the code.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Step: Setup Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      ### LIB CHECKS ###

      # Step: Define how to cache the lib Elixir dependencies.
      - name: Cache lib Elixir deps
        id: cache-lib-elixir-deps
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-deps
        with:
          path: deps
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Define how to cache the lib Elixir build.
      - name: Cache lib Elixir build
        id: cache-lib-elixir-build
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-build
        with:
          path: _build
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Download lib Elixir dependencies.
      # If unchanged, uses the cached version.
      - name: Download lib Elixir deps
        uses: nick-fields/retry@v4
        with:
          command: mix deps.get
          timeout_minutes: 3
          max_attempts: 10

      # Step: Download lib JavaScript dependencies.
      - name: Download lib JavaScript deps
        uses: nick-fields/retry@v4
        with:
          command: cd assets && npm clean-install
          shell: bash
          timeout_minutes: 3
          max_attempts: 10

      # Step: Compile the lib project treating any warnings as errors.
      - name: Check lib project compiles without warnings
        run: mix compile --all-warnings --warnings-as-errors

      # Step: Execute lib Elixir tests, except the ones that run in a job of their own: the
      # compile task tests (lib_compile_task_tests), the database tests (lib_database_tests)
      # and the consistency tests (lib_checks). Excluding the database tests also tells the
      # suite's test helper not to boot the database, so this job needs no server.
      # TODO: Remove the two --formatter flags with Hologram.Test.SlowestTestsFormatter, which
      # prints the slowest tests without the trace mode --slowest turns on.
      - name: Run lib Elixir tests
        run: mix test --warnings-as-errors --exclude consistency --exclude compile_task --exclude database --formatter ExUnit.CLIFormatter --formatter Hologram.Test.SlowestTestsFormatter

      # Step: Execute lib JavaScript tests.
      - name: Run lib JavaScript tests
        run: mix test.js

  lib_compile_task_tests:
    runs-on: ${{ matrix.os }}
    name: Lib Compile Task Tests on ${{ matrix.os }}, Elixir ${{ matrix.elixir }}, Erlang/OTP ${{ matrix.otp }}, Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      # Mix.Tasks.Compile.HologramTest (tagged :compile_task) is most of the lib suite's serial
      # phase, and a test module cannot be split across jobs, so it runs in a job of its own on
      # every tier, alongside the rest of the suite. The split is by tag rather than with
      # --partitions, which assigns files by a hash of their names: the module's job would then
      # also get whatever files hash with it.
      #
      # The module's file is named in the test step rather than selected with
      # --only compile_task: selecting by tag makes ExUnit load every test file of the suite
      # before it excludes the tests in them.
      #
      # The tiers must stay in sync with the lib_tests matrix. See the notes on the bounds there.
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5"
            node: "24.13.0"
          - os: ubuntu-latest
            elixir: "1.20.0"
            otp: "28.5"
            node: "24.13.0"
          - os: ubuntu-latest
            elixir: "1.20.0"
            otp: "29.0"
            node: "24.13.0"
          - os: windows-2022
            elixir: "1.20.0"
            otp: "29.0"
            node: "24.13.0"
    steps:
      # Step: Setup Elixir + Erlang/OTP image as the base.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Step: Checkout the code.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Step: Setup Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      ### LIB CHECKS ###

      # Step: Define how to cache the lib Elixir dependencies.
      - name: Cache lib Elixir deps
        id: cache-lib-elixir-deps
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-deps
        with:
          path: deps
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Define how to cache the lib Elixir build.
      - name: Cache lib Elixir build
        id: cache-lib-elixir-build
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-build
        with:
          path: _build
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Download lib Elixir dependencies.
      # If unchanged, uses the cached version.
      - name: Download lib Elixir deps
        uses: nick-fields/retry@v4
        with:
          command: mix deps.get
          timeout_minutes: 3
          max_attempts: 10

      # Step: Download lib JavaScript dependencies.
      - name: Download lib JavaScript deps
        uses: nick-fields/retry@v4
        with:
          command: cd assets && npm clean-install
          shell: bash
          timeout_minutes: 3
          max_attempts: 10

      # Step: Execute lib compile task tests. The module holds no database test, and
      # --exclude database tells the suite's test helper not to boot the database, so this job
      # needs no server.
      - name: Run lib compile task tests
        run: mix test --warnings-as-errors --exclude database test/elixir/mix/tasks/compile/hologram_test.exs

  lib_database_tests:
    runs-on: ${{ matrix.os }}
    name: Lib Database Tests on ${{ matrix.os }}, Elixir ${{ matrix.elixir }}, Erlang/OTP ${{ matrix.otp }}, Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      # The database tests (tagged :database: the modules of DatabaseCase and
      # ScratchDatabaseCase, and the files tagged by hand) are the only lib tests that need a
      # Postgres server, so they run in a job of their own and only this job starts one.
      #
      # They are selected by the tag alone, which makes ExUnit load every test file of the
      # suite before it excludes the rest. A list of paths would load fewer, but the other lib
      # jobs exclude by the same tag, so a database test in a file off such a list would run
      # in no job and nothing would fail.
      #
      # The tiers must stay in sync with the lib_tests matrix. See the notes on the bounds there.
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5"
            node: "24.13.0"
          - os: ubuntu-latest
            elixir: "1.20.0"
            otp: "28.5"
            node: "24.13.0"
          - os: ubuntu-latest
            elixir: "1.20.0"
            otp: "29.0"
            node: "24.13.0"
          - os: windows-2022
            elixir: "1.20.0"
            otp: "29.0"
            node: "24.13.0"
    steps:
      # Step: Setup Elixir + Erlang/OTP image as the base.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Step: Checkout the code.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Step: Setup Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      ### LIB CHECKS ###

      # Step: Define how to cache the lib Elixir dependencies.
      - name: Cache lib Elixir deps
        id: cache-lib-elixir-deps
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-deps
        with:
          path: deps
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Define how to cache the lib Elixir build.
      - name: Cache lib Elixir build
        id: cache-lib-elixir-build
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-build
        with:
          path: _build
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Download lib Elixir dependencies.
      # If unchanged, uses the cached version.
      - name: Download lib Elixir deps
        uses: nick-fields/retry@v4
        with:
          command: mix deps.get
          timeout_minutes: 3
          max_attempts: 10

      # Step: Download lib JavaScript dependencies.
      - name: Download lib JavaScript deps
        uses: nick-fields/retry@v4
        with:
          command: cd assets && npm clean-install
          shell: bash
          timeout_minutes: 3
          max_attempts: 10

      # Step: Start the runner image's preinstalled Postgres server (service containers are
      # Linux-only, so both OSes start the local server and align it with the zero-config
      # test defaults: localhost:5432, postgres/postgres).
      - name: Start Postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

          # Make the server self-report what a stalled query was waiting on: lock waits
          # name the blocking session, checkpoints show an I/O storm, and any statement
          # over two seconds logs its true duration - the backend finishes and logs even
          # when the client has given up on it. Dumped by the failure-only step below.
          sudo -u postgres psql -c "ALTER SYSTEM SET log_lock_waits = on;"
          sudo -u postgres psql -c "ALTER SYSTEM SET log_min_duration_statement = 2000;"
          sudo -u postgres psql -c "ALTER SYSTEM SET log_checkpoints = on;"
          sudo -u postgres psql -c "SELECT pg_reload_conf();"

      # Step: Sample the runner, so a stalled query can be told apart from a stalled
      # machine - the st column is CPU stolen by the hypervisor, r is the run queue.
      # Read by the failure-only step below.
      - name: Sample runner activity (Linux)
        if: runner.os == 'Linux'
        run: nohup vmstat -t 5 > "$RUNNER_TEMP/vmstat.log" 2>&1 &

      # Step: Restore Postgres 16's server files on Windows, the folders "Start Postgres
      # (Windows)" unpacks from EDB's binaries zip on a miss. The key names the version, so a
      # version change downloads the new zip.
      - name: Restore Postgres cache (Windows)
        id: restore-postgres-cache-windows
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          key: postgres-windows-16.4-1
          path: ${{ runner.temp }}\pgsql

      # The windows-2022 image preinstalls Postgres 14, below Hologram's Postgres 15 floor
      # (NULLS NOT DISTINCT index + indnullsnotdistinct introspection) - run 16 instead of
      # starting the preinstalled service.
      - name: Start Postgres (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PGPASSWORD: postgres
        run: |
          # The server's files from EDB's binaries zip, then initdb and pg_ctl. EDB's installer
          # unpacks a full distribution and registers a Windows service, which a test run has
          # no use for. Downloaded from EDB rather than through Chocolatey: the community feed
          # rate-limits CI runners and answers "package was not found" while it does, which no
          # amount of retrying resolves (it outlasted three attempts on 2026-08-14). The
          # version is pinned so a CI run is reproducible.
          $pgsql = "$env:RUNNER_TEMP\pgsql"
          $pgdata = "$env:RUNNER_TEMP\pgdata"
          $psql = "$pgsql\bin\psql.exe"
          $zip = "$env:RUNNER_TEMP\postgresql-16-windows-x64-binaries.zip"
          $url = "https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip"

          # EDB publishes no checksum file, so this one was taken from the artifact itself on
          # 2026-10-14, a download of 338,727,828 bytes. Nothing else authenticates what is
          # about to run as administrator: the URL pins a name, not the bytes served under it.
          $expectedSha256 = "3508D8F085BC3980F38211A82E3F31E5FCAE9952105D3DC2F8BE67B64A822BAA"

          function Write-Phase($phase) { Write-Host "$(Get-Date -Format HH:mm:ss) $phase" }

          # The files come from the restore step above while its entry lasts. A miss - a
          # version change, or an entry evicted after a week unused - downloads the zip.
          if (Test-Path "$pgsql\bin\pg_ctl.exe") {
            Write-Phase "server files restored from the cache"
          } else {
            Write-Phase "cache miss, downloading the zip"

            foreach ($attempt in 1..3) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              } catch {
                Write-Host "download attempt $attempt failed: $_"

                # A failed transfer leaves what it managed to write, and those bytes would
                # fail the checksum below - which is fatal by design, turning a dropped
                # connection into a failed job. Removing them lets the retry mean something.
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
              }

              if (Test-Path $zip) { break }

              if ($attempt -eq 3) {
                throw "the Postgres 16 zip was not downloaded after 3 attempts - see the output above"
              }

              Start-Sleep -Seconds (15 * $attempt)
            }

            $sha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash

            # Fatal rather than retried: a mismatch means the bytes are not the artifact this
            # workflow pinned, and downloading them again cannot make them so.
            if ($sha256 -ne $expectedSha256) {
              throw "Postgres zip checksum mismatch - expected $expectedSha256, got $sha256"
            }

            Write-Phase "unpacking the server's folders"

            # Only what a server needs: the executables with their DLLs, the extensions, and
            # what initdb reads. They are 119 MB of the archive's 920 MB unpacked - pgAdmin,
            # the debug symbols, StackBuilder, the headers and the docs stay out of the cache.
            # Windows' own tar, by its full path: it reads zip archives, and a GNU tar earlier
            # on the PATH would not.
            & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP pgsql/bin pgsql/lib pgsql/share

            if ($LASTEXITCODE -ne 0) {
              throw "unpacking the Postgres zip failed - see the output above"
            }

            Remove-Item $zip -Force
          }

          Write-Phase "initdb"

          # A fresh data directory every run, never cached. Trust auth: the suite's
          # postgres/postgres credentials are accepted as they are.
          & "$pgsql\bin\initdb.exe" -U postgres --auth=trust -E UTF8 -D $pgdata

          if ($LASTEXITCODE -ne 0) {
            throw "initdb failed - see the output above"
          }

          Write-Phase "starting the server"

          # Postgres refuses to run under an administrative account, and the runner's is one:
          # pg_ctl and initdb start it under a restricted token. A refused start leaves its
          # reason in the server's log, printed here.
          & "$pgsql\bin\pg_ctl.exe" -D $pgdata -l "$env:RUNNER_TEMP\pg.log" -o "-p 5432" start -w

          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP\pg.log" -ErrorAction SilentlyContinue
            throw "Postgres 16 did not start - its log is above"
          }

          Write-Phase "checking the server"

          # pg_ctl -w returns once the server accepts connections, so the first probe should
          # answer. The loop stays for the version check: the port is whatever holds it, and
          # this image ships Postgres 14. A running 14 would answer here and the suite would
          # quietly run below Hologram's floor.
          foreach ($attempt in 1..30) {
            $reported = & $psql -U postgres -tAc "SHOW server_version_num"

            if ($LASTEXITCODE -eq 0) {
              $serverVersion = ($reported | Out-String).Trim()

              if ([int]$serverVersion -lt 160000) {
                throw "port 5432 is served by server_version_num $serverVersion, not the 16 this job started - another server is holding it"
              }

              & $psql -U postgres -c "SELECT version();"

              break
            }

            if ($attempt -eq 30) {
              throw "Postgres 16 started but never accepted connections - see the output above"
            }

            Start-Sleep -Seconds 2
          }

          # The database lives for this job alone, so nothing is gained by waiting for the disk
          # on every commit, and the scratch tier creates and drops a database per test.
          # Measured on this runner: the tests' serial phase took about 113 s with the three
          # settings off against about 132 s with the server as installed. The Linux step
          # does not set them, since the same trial showed no difference there.
          & $psql -U postgres -c "ALTER SYSTEM SET fsync = off;"
          & $psql -U postgres -c "ALTER SYSTEM SET synchronous_commit = off;"
          & $psql -U postgres -c "ALTER SYSTEM SET full_page_writes = off;"
          & $psql -U postgres -c "SELECT pg_reload_conf();"

          Write-Phase "ready"

      # Step: Save Postgres 16's server files on a cache miss, right after they are unpacked
      # rather than at the end of the job, so that a run whose tests fail still keeps them.
      - name: Save Postgres cache (Windows)
        if: runner.os == 'Windows' && steps.restore-postgres-cache-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: postgres-windows-16.4-1
          path: ${{ runner.temp }}\pgsql

      # Step: Execute lib database tests.
      - name: Run lib database tests
        run: mix test --warnings-as-errors --only database

      # Step: On failure, print what the server and the machine were doing - a stalled
      # query is diagnosable only from this side, because the client's timeout destroys
      # the evidence when it fires.
      - name: Dump stall diagnostics (Linux)
        if: ${{ failure() && runner.os == 'Linux' }}
        run: |
          sudo tail -n 300 /var/log/postgresql/postgresql-*-main.log || true
          tail -n 200 "$RUNNER_TEMP/vmstat.log" || true

  lib_checks:
    runs-on: ubuntu-latest
    name: Lib Checks on ubuntu-latest, Elixir ${{ matrix.elixir }}, Erlang/OTP ${{ matrix.otp }}, Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      # Everything that inspects the codebase rather than running it gives the same answer on
      # every tier of the lib_tests matrix, so it runs once, on the highest one, alongside the
      # tests rather than after them. The consistency tests run here too: they compare the
      # client runtime against one Elixir and Erlang/OTP version.
      #
      # The versions must match the highest tier of the lib_tests matrix, so that this job and
      # that tier share the deps and build caches.
      matrix:
        elixir:
          - "1.20.0"
        otp:
          - "29.0"
        node:
          # Must match .tool-versions for dev/prod/CI parity.
          - "24.13.0"
    steps:
      # Step: Setup Elixir + Erlang/OTP image as the base.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Step: Checkout the code.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Step: Setup Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      ### LIB CHECKS ###

      # Step: Define how to cache the lib Elixir dependencies.
      - name: Cache lib Elixir deps
        id: cache-lib-elixir-deps
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-deps
        with:
          path: deps
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Define how to cache the lib Elixir build.
      - name: Cache lib Elixir build
        id: cache-lib-elixir-build
        uses: actions/cache@v6
        env:
          cache-name: cache-lib-elixir-build
        with:
          path: _build
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      # Step: Download lib Elixir dependencies.
      # If unchanged, uses the cached version.
      - name: Download lib Elixir deps
        uses: nick-fields/retry@v4
        with:
          command: mix deps.get
          timeout_minutes: 3
          max_attempts: 10

      # Step: Download lib JavaScript dependencies.
      - name: Download lib JavaScript deps
        uses: nick-fields/retry@v4
        with:
          command: cd assets && npm clean-install
          shell: bash
          timeout_minutes: 3
          max_attempts: 10

      # Step: Compile the lib project.
      - name: Compile lib project
        run: mix compile

      # Step: Check if lib mix.lock has any unused dependencies.
      - name: Check lib unused Elixir deps
        run: mix deps.unlock --check-unused

      # Step: Check if there are any lib Elixir dependencies which have been marked as retired.
      #
      # Both audits read mix.lock and fail on a retirement or an advisory published since the
      # lock was last touched, which would turn every branch red on the day it's published. The
      # lock is what Hologram is built and tested with, not what users install, so the audits run
      # on master only: pull requests skip them, and a merge commit goes red when master's lock
      # needs a fix.
      - name: Check lib retired Elixir deps
        if: ${{ github.ref == 'refs/heads/master' }}
        run: mix hex.audit

      # Step: Check if there are any security vulnerabilities in the lib Elixir dependencies.
      - name: Check lib security vulnerabilities in Elixir deps
        if: ${{ github.ref == 'refs/heads/master' }}
        run: mix deps.audit

      # Step: Check that the lib Elixir code has already been formatted.
      - name: Check lib Elixir code formatted
        run: mix format --check-formatted

      # Step: Check that the lib JavaScript, JSON & YAML code has already been formatted.
      - name: Check lib JavaScript, JSON & YAML code formatted
        run: mix format.js.check

      # Step: Check that lib doc and spec coverage are above thresholds (with Doctor).
      - name: Check lib doc and spec coverage
        run: mix doctor

      # Step: Run lib Elixir static code analysis with Credo.
      - name: Run lib Elixir static code analysis with Credo
        run: mix credo --strict

      # Step: Run lib Elixir security-focused analysis with Sobelow.
      - name: Run lib Elixir security-focused analysis with Sobelow
        run: mix sobelow --config

      # Step: Restore lib Dialyzer PLT cache.
      # Cache key is based on Erlang/Elixir version and the mix.lock hash.
      - name: Restore lib Dialyzer PLT cache
        id: restore-lib-dialyzer-plt-cache
        uses: actions/cache/restore@v6
        with:
          key: |
            dialyzer-plt-lib-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          path: |
            .dialyzer

      # Step: Create lib Dialyzer PLTs if no cache was found.
      - name: Create lib Dialyzer PLTs
        if: ${{ steps.restore-lib-dialyzer-plt-cache.outputs.cache-hit != 'true' }}
        run: mix dialyzer --plt

      # Step: Save lib Dialyzer PLT cache.
      # By default, the GitHub Cache action will only save the cache if all steps in the job succeed,
      # so we separate the cache restore and save steps in case running dialyzer fails.
      - name: Save lib Dialyzer PLT cache
        id: save-lib-dialyzer-plt-cache
        uses: actions/cache/save@v6
        if: ${{ steps.restore-lib-dialyzer-plt-cache.outputs.cache-hit != 'true' }}
        with:
          key: |
            dialyzer-plt-lib-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          path: |
            .dialyzer

      # Step: Run lib Elixir static code analysis with Dialyzer.
      - name: Run lib Elixir static code analysis with Dialyzer
        run: mix dialyzer --format github

      # Step: Check that all lib test scripts have valid file names.
      - name: Check lib test file names
        run: mix holo.check.test_file_names test/elixir

      # Step: Run lib JavaScript static code analysis with ESLint.
      - name: Run lib JavaScript static code analysis with ESLint
        run: mix eslint

      # Step: Execute lib Elixir consistency tests. --exclude database tells the suite's test
      # helper not to boot the database, so this job needs no server.
      - name: Run lib Elixir consistency tests
        run: mix test --warnings-as-errors --only consistency --exclude database

  feature_tests:
    runs-on: ubuntu-latest
    name: Feature Tests (partition ${{ matrix.partition }}) on ubuntu-latest, Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }}, Node.js ${{ matrix.node }}
    defaults:
      run:
        working-directory: test/features
    strategy:
      fail-fast: false
      # Specify the Elixir and OTP versions to use when building
      # and running the workflow steps.
      matrix:
        elixir:
          # Run feature tests on latest pinned stable Elixir version only
          - "1.20.0"
        otp:
          # Run feature tests on latest pinned stable OTP version only
          - "29.0"
        node:
          # Run feature tests on latest LTS version only.
          # Must match .tool-versions for dev/prod/CI parity.
          - "24.13.0"
        # The suite is split across runners rather than run concurrently within one,
        # because a browser-driven suite is what exhausted a single runner before -
        # see the max_cases note in test/features/test/test_helper.exs. Each partition
        # is its own runner running one browser at a time, so per-runner load is
        # unchanged no matter how many partitions there are.
        #
        # Two bounds pin the count. Below, no partition count beats ~2 minutes:
        # operators_test.exs holds 44 of the suite's ~600 tests and a single file
        # cannot be split across partitions, and every partition repeats ~50s of
        # checkout, setup and compile. Above, the account runs at most 20 concurrent
        # jobs, and the other jobs in this workflow take 7 of them.
        #
        # 8 is the policy choice between them: ~4 minutes, 15 concurrent jobs, and
        # enough headroom that no partition waits for a runner. More partitions keep
        # helping - 12 would save a further ~40s - but at 19 jobs a queued partition
        # would cost more than the balance gains.
        #
        # Must stay in sync with --partitions in the test step below. A partition
        # listed here but outside that range fails loudly, but dropping one silently
        # skips its files.
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Everything that inspects the codebase rather than running it is identical on
      # every partition, so it runs on one. Without this each partition would repeat
      # the analysis, and on a cold cache all of them would build the Dialyzer PLT and
      # race to save the same key.
      IS_FIRST_PARTITION: ${{ matrix.partition == 1 }}
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      # Step: Setup Elixir + Erlang/OTP image as the base.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Step: Checkout the code.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Step: Setup Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      ### FEATURE TESTS APP CHECKS ###

      # Step: Define how to cache the feature tests app Elixir dependencies.
      - name: Cache feature tests app Elixir deps
        id: cache-feature-tests-app-elixir-deps
        uses: actions/cache@v6
        env:
          cache-name: cache-feature-tests-app-elixir-deps
        with:
          path: test/features/deps
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('test/features/mix.lock') }}

      # Step: Define how to cache the feature tests app Elixir build.
      - name: Cache feature tests app Elixir build
        id: cache-feature-tests-app-elixir-build
        uses: actions/cache@v6
        env:
          cache-name: cache-feature-tests-app-elixir-build
        with:
          path: test/features/_build
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('test/features/mix.lock') }}

      # Step: Download feature tests app Elixir dependencies.
      # If unchanged, uses the cached version.
      - name: Download feature tests app Elixir deps
        uses: nick-fields/retry@v4
        with:
          # TODO: set working directory with action input when https://github.com/nick-fields/retry/issues/89 is implemented
          command: cd test/features && mix deps.get
          shell: bash
          timeout_minutes: 3
          max_attempts: 10

      # Step: Download feature tests app JavaScript dependencies.
      - name: Download feature tests app JavaScript deps
        uses: nick-fields/retry@v4
        with:
          command: cd test/features/assets && npm clean-install
          shell: bash
          timeout_minutes: 3
          max_attempts: 10

      # Step: Compile the feature tests app project treating any warnings as errors.
      - name: Check feature tests app project compiles without warnings
        run: mix compile --all-warnings --warnings-as-errors

      # Step: Check if feature tests app mix.lock has any unused dependencies.
      - name: Check feature tests app unused Elixir deps
        if: ${{ env.IS_FIRST_PARTITION == 'true' }}
        run: mix deps.unlock --check-unused

      # Step: Check that the feature tests app Elixir code has already been formatted.
      - name: Check feature tests app Elixir code formatted
        if: ${{ env.IS_FIRST_PARTITION == 'true' }}
        run: mix format --check-formatted

      # Step: Run feature tests app Elixir static code analysis with Credo.
      - name: Run feature tests app Elixir static code analysis with Credo
        if: ${{ env.IS_FIRST_PARTITION == 'true' }}
        run: mix credo --strict

      # Step: Restore feature tests app Dialyzer PLT cache.
      # Cache key is based on Erlang/Elixir version and the mix.lock hash.
      - name: Restore feature tests app Dialyzer PLT cache
        id: restore-feature-tests-app-dialyzer-plt-cache
        uses: actions/cache/restore@v6
        with:
          key: |
            dialyzer-plt-feature-tests-app-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('test/features/mix.lock') }}
          path: |
            test/features/priv/plts
        if: ${{ env.IS_FIRST_PARTITION == 'true' }}

      # Step: Create feature tests app Dialyzer PLTs if no cache was found.
      - name: Create feature tests app Dialyzer PLTs
        if: ${{ env.IS_FIRST_PARTITION == 'true' && steps.restore-feature-tests-app-dialyzer-plt-cache.outputs.cache-hit != 'true' }}
        run: mix dialyzer --plt

      # Step: Save feature tests app Dialyzer PLT cache.
      # By default, the GitHub Cache action will only save the cache if all steps in the job succeed,
      # so we separate the cache restore and save steps in case running dialyzer fails.
      - name: Save feature tests app Dialyzer PLT cache
        id: save-feature-tests-app-dialyzer-plt-cache
        uses: actions/cache/save@v6
        if: ${{ env.IS_FIRST_PARTITION == 'true' && steps.restore-feature-tests-app-dialyzer-plt-cache.outputs.cache-hit != 'true' }}
        with:
          key: |
            dialyzer-plt-feature-tests-app-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('test/features/mix.lock') }}
          path: |
            test/features/priv/plts

      # Step: Run feature tests app Elixir static code analysis with Dialyzer.
      - name: Run feature tests app Elixir static code analysis with Dialyzer
        if: ${{ env.IS_FIRST_PARTITION == 'true' }}
        run: mix dialyzer --format github

      # Step: Check that all feature tests app test scripts have valid file names.
      - name: Check feature tests app test file names
        if: ${{ env.IS_FIRST_PARTITION == 'true' }}
        run: mix holo.check.test_file_names test

      # Step: Start the runner image's preinstalled Postgres server, aligned with the
      # zero-config test defaults (localhost:5432, postgres/postgres) - the feature app
      # declares entities, which activates the Hologram database.
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      # Step: Execute this partition's share of the feature tests app Elixir tests.
      # Mix sorts the test files and deals them round-robin across the partitions,
      # selecting this runner's share with MIX_TEST_PARTITION, so new test files are
      # picked up without a list to maintain. Must stay in sync with the partition
      # matrix above.
      - name: Run feature tests app Elixir tests
        run: mix test --warnings-as-errors --partitions 8

      # Step: Archive the browser screenshots of tests that failed.
      - name: Archive fail screenshots
        # Execute the step even if the job has already failed, but don't execute it if the job has been canceled.
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: fail-screenshots-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.node }}-partition-${{ matrix.partition }}
          path: test/features/tmp/screenshots

