        run: mix deps.unlock --check-unused

      # Step: Check if there are any umbrella tests app Elixir dependencies which have been marked as retired.
      - name: Check umbrella tests app retired Elixir deps
        if: ${{ env.IS_HIGHEST_MATRIX_COMBINATION == 'true' }}
