version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "mix"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"

  - package-ecosystem: "npm"
    directory: "/assets"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"

  - package-ecosystem: "mix"
    directory: "/test/cluster"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "hologram"

  - package-ecosystem: "mix"
    directory: "/test/cowboy"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "hologram"

  - package-ecosystem: "mix"
    directory: "/test/ecosystem"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "hologram"

  - package-ecosystem: "mix"
    directory: "/test/features"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "hologram"

  - package-ecosystem: "mix"
    directory: "/test/minimal"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "hologram"

  - package-ecosystem: "mix"
    directory: "/test/umbrella"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "hologram"

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
